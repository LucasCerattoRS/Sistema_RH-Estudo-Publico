name: CI
on:
  push:
  pull_request:
jobs:
  exemplos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exemplos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exemplos/package-lock.json
      - run: npm ci
      - run: npm test
